[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovos-n8n-jarvis-persona"
version = "0.2.0"
description = "OVOS JARVIS Persona plugin with N8N workflow integration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["ovos", "n8n", "jarvis", "persona", "ai", "voice", "assistant", "iron-man"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ovos-plugin-manager>=0.0.25",
    "ovos-utils>=0.0.38",
    "requests>=2.31.0",
    "pydbus>=0.6.0",
    "aiohttp>=3.9.0",
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/reklis/ovos-n8n-jarvis-persona"
Repository = "https://github.com/reklis/ovos-n8n-jarvis-persona.git"
Issues = "https://github.com/reklis/ovos-n8n-jarvis-persona/issues"

[project.entry-points."opm.solver.chat"]
ovos-n8n-jarvis-solver = "ovos_n8n_agent_plugin.solver:N8NJarvisSolver"

[project.entry-points."opm.persona"]
jarvis = "ovos_n8n_agent_plugin.persona_config:get_jarvis_persona"

[tool.hatch.build.targets.wheel]
packages = ["ovos_n8n_agent_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "/ovos_n8n_agent_plugin",
    "/config",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=ovos_n8n_agent_plugin",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["ovos_n8n_agent_plugin"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]