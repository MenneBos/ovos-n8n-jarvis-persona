{
  "lang": "en-us",
  "listener": {
    "VAD": {
      "module": "ovos-vad-plugin-silero",
      "ovos-vad-plugin-silero": {
        "threshold": 0.1
      }
    },
    "wake_word": "hey_jarvis",
    "hybrid_listen": true,
    "listen_timeout": 10
  },
  "hotwords": {
    "hey_jarvis": {
      "listen": true,
      "debug": true,
      "module": "ovos-ww-plugin-openwakeword",
      "models": [
        "/home/ovos/hey_jarvis_v0.1.tflite"
      ],
      "inference_framework": "tflite",
      "threshold": 0.3,
      "custom_verifier_threshold": 0.1
    }
  },
  "intents": {
    "persona": {
      "handle_fallback": true,
      "default_persona": "JARVIS"
    },
    "pipeline": [
      "stop_high",
      "converse",
      "ovos-persona-pipeline-plugin-high",
      "padatious_high",
      "adapt_high",
      "padatious_medium",
      "adapt_medium",
      "common_qa",
      "ovos-persona-pipeline-plugin-low",
      "fallback_high",
      "padatious_low",
      "adapt_low",
      "fallback_medium",
      "fallback_low"
    ]
  }
}